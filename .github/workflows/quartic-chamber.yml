name: Verify interlacing through the first quartic
on:
  push:
    paths:
      - 'quartic-chamber/**'
      - '.github/workflows/quartic-chamber.yml'
  pull_request:
    paths:
      - 'quartic-chamber/**'
      - '.github/workflows/quartic-chamber.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quartic-chamber-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-quartic-chamber:
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check archived inputs and replay integer and rational certificates
        run: |
          receipts="$RUNNER_TEMP/quartic-chamber-receipts"
          mkdir "$receipts"
          sha256sum --check --quiet SHA256SUMS
          (cd quartic-chamber && sha256sum --check SHA256SUMS) | tee "$receipts/artifact-hashes.log"
          (cd quartic-chamber/formal && sha256sum --check SOURCE-SHA256SUMS) | tee "$receipts/source-hashes.log"
          (
            cd quartic-chamber/paper
            for check in verify-quadratic cubic-boxes cubic-finite cubic-independent; do
              python3 -B "anc/$check.py"
              echo "checker $check exit 0"
            done
          ) > "$receipts/arithmetic.log"
          cmp quartic-chamber/verification/check-replay.log "$receipts/arithmetic.log"
          deps="$(mktemp -d "$RUNNER_TEMP/quartic-deps.XXXXXXXX")"
          cp quartic-chamber/formal/{lean-toolchain,lakefile.toml,lake-manifest.json} "$deps/"
          printf 'QUARTIC_DEPS=%s\n' "$deps" >> "$GITHUB_ENV"

      - name: Install the pinned Lean toolchain
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: ${{ env.QUARTIC_DEPS }}
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'

      - name: Retrieve the locked external dependency objects
        run: |
          receipts="$RUNNER_TEMP/quartic-chamber-receipts"
          grep -rhE '^import Mathlib(\.[A-Za-z_][A-Za-z_0-9]*)*$' --include='*.lean' quartic-chamber/formal/OrderedPartitions |
            cut -d' ' -f2 | sort -u > "$receipts/mathlib-cache-roots.txt"
          mapfile -t imports < "$receipts/mathlib-cache-roots.txt"
          test "${#imports[@]}" -gt 0
          (
            cd "$QUARTIC_DEPS"
            lake exe cache get "${imports[@]}"
          ) 2>&1 | tee "$receipts/mathlib-cache.log"
          cmp quartic-chamber/formal/lake-manifest.json "$QUARTIC_DEPS/lake-manifest.json"

      - name: Cold-build all 81 modules and independently replay them
        run: |
          if ! ulimit -Sn 65536 2>/dev/null; then
            printf 'Keeping the current open-file limit of %s\n' "$(ulimit -Sn)"
          fi
          receipts="$RUNNER_TEMP/quartic-chamber-receipts"
          proof="$(mktemp -d "$RUNNER_TEMP/quartic-proof.XXXXXXXX")"
          cp -R quartic-chamber/formal/. "$proof/"
          test ! -e "$proof/.lake"
          cp quartic-chamber/verification/audit_verify_serial.py "$proof/"
          python3 -Bu "$proof/audit_verify_serial.py" "$QUARTIC_DEPS/.lake/packages" 1 \
            2>&1 | tee "$receipts/lean-cold.log"
          grep -Fx 'PASS 62 standalone cubic finite-cutoff axiom reports' "$receipts/lean-cold.log"
          grep -Fx 'PASS 81 cold project modules, 81 independent kernel replays, 187 transitive axiom printouts' "$receipts/lean-cold.log"
          {
            printf 'module\tsource_sha256\tobject_sha256\n'
            sed -nE 's/^kernel_replay_exit=0 ([^ ]+) source_sha256=([0-9a-f]+) object_sha256=([0-9a-f]+)$/\1\t\2\t\3/p' "$receipts/lean-cold.log"
          } > "$receipts/module-receipts.tsv"
          cmp quartic-chamber/verification/module-receipts.tsv "$receipts/module-receipts.tsv"

      - name: Save verification receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quartic-chamber-verification
          path: ${{ runner.temp }}/quartic-chamber-receipts/
          if-no-files-found: warn
          retention-days: 14
