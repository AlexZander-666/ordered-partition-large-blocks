name: Verify the bounded-ratio proof
on:
  push:
    paths:
      - 'bounded-ratio/**'
      - '.github/workflows/bounded-ratio.yml'
  pull_request:
    paths:
      - 'bounded-ratio/**'
      - '.github/workflows/bounded-ratio.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bounded-ratio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-bounded-ratio:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check frozen files and prepare the dependency workspace
        run: |
          receipts="$RUNNER_TEMP/bounded-ratio-receipts"
          mkdir -p "$receipts"
          (cd bounded-ratio && sha256sum --check SHA256SUMS) | tee "$receipts/release-hashes.log"
          (cd bounded-ratio/formal && sha256sum --check SOURCE-SHA256SUMS) | tee "$receipts/source-hashes.log"
          dependencies="$(mktemp -d "$RUNNER_TEMP/bounded-ratio-deps.XXXXXXXX")"
          cp bounded-ratio/formal/{lean-toolchain,lakefile.toml,lake-manifest.json} "$dependencies/"
          printf 'BOUNDED_RATIO_DEPS=%s\n' "$dependencies" >> "$GITHUB_ENV"

      - name: Install the pinned Lean toolchain
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: ${{ env.BOUNDED_RATIO_DEPS }}
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'

      - name: Prepare the locked Mathlib imports
        run: |
          receipts="$RUNNER_TEMP/bounded-ratio-receipts"
          grep -rhE '^import Mathlib(\.[A-Za-z_][A-Za-z_0-9]*)*$' --include='*.lean' bounded-ratio/formal/OrderedPartitions |
            cut -d' ' -f2 | sort -u > "$receipts/mathlib-cache-roots.txt"
          mapfile -t imports < "$receipts/mathlib-cache-roots.txt"
          test "${#imports[@]}" -gt 0
          (
            cd "$BOUNDED_RATIO_DEPS"
            lake exe cache get "${imports[@]}"
          ) 2>&1 | tee "$receipts/mathlib-cache.log"
          cmp bounded-ratio/formal/lake-manifest.json "$BOUNDED_RATIO_DEPS/lake-manifest.json"

      - name: Cold-build all 76 modules and replay the proofs
        run: |
          if ! ulimit -Sn 65536 2>/dev/null; then
            printf 'Keeping the current open-file limit of %s\n' "$(ulimit -Sn)"
          fi
          test ! -e bounded-ratio/formal/.lake
          receipts="$RUNNER_TEMP/bounded-ratio-receipts"
          python3 -Bu bounded-ratio/formal/verify.py "$BOUNDED_RATIO_DEPS/.lake/packages" 2 \
            2>&1 | tee "$receipts/lean-cold.log"
          {
            printf 'module\tsource_sha256\tobject_sha256\n'
            sed -nE 's/^kernel_replay_exit=0 ([^ ]+) source_sha256=([0-9a-f]+) object_sha256=([0-9a-f]+)$/\1\t\2\t\3/p' "$receipts/lean-cold.log"
          } > "$receipts/module-receipts.tsv"
          cmp bounded-ratio/verification/module-receipts.tsv "$receipts/module-receipts.tsv"

      - name: Save the verification receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bounded-ratio-verification
          path: ${{ runner.temp }}/bounded-ratio-receipts/
          if-no-files-found: warn
          retention-days: 14
