name: Verify full interlacing windows for ordered set partitions
on:
  push:
    branches: [main]
    paths: ['bounded-window/**', '.github/workflows/verify-bounded-window.yml']
  pull_request:
    paths: ['bounded-window/**', '.github/workflows/verify-bounded-window.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bounded-window-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-bounded-window:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: bounded-window
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check the archived paper, formal inputs and dependency lock
        run: |
          receipts="$RUNNER_TEMP/bounded-window-receipts"
          mkdir "$receipts"
          sha256sum --check SHA256SUMS | tee "$receipts/artifact-hashes.log"
          (cd formal && sha256sum --check SOURCE-SHA256SUMS) | tee "$receipts/source-hashes.log"
          deps="$(mktemp -d "$RUNNER_TEMP/bounded-window-deps.XXXXXXXX")"
          cp formal/{lean-toolchain,lakefile.toml,lake-manifest.json} "$deps/"
          printf 'BOUNDED_WINDOW_DEPS=%s\n' "$deps" >> "$GITHUB_ENV"

      - name: Install the pinned Lean toolchain
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: ${{ env.BOUNDED_WINDOW_DEPS }}
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'

      - name: Retrieve the locked external dependency objects
        run: |
          receipts="$RUNNER_TEMP/bounded-window-receipts"
          grep -rhE '^import Mathlib(\.[A-Za-z_][A-Za-z_0-9]*)*$' --include='*.lean' formal/OrderedPartitions |
            cut -d' ' -f2 | sort -u > "$receipts/mathlib-cache-roots.txt"
          mapfile -t imports < "$receipts/mathlib-cache-roots.txt"
          test "${#imports[@]}" -gt 0
          (
            cd "$BOUNDED_WINDOW_DEPS"
            lake exe cache get "${imports[@]}"
          ) 2>&1 | tee "$receipts/mathlib-cache.log"
          cmp formal/lake-manifest.json "$BOUNDED_WINDOW_DEPS/lake-manifest.json"

      - name: Cold-build and independently replay the paper proof
        run: |
          if ! ulimit -Sn 65536 2>/dev/null; then
            printf 'Keeping the current open-file limit of %s\n' "$(ulimit -Sn)"
          fi
          receipts="$RUNNER_TEMP/bounded-window-receipts"
          test ! -e formal/.lake
          python3 -Bu formal/verify.py "$BOUNDED_WINDOW_DEPS/.lake/packages" 1 \
            2>&1 | tee "$receipts/lean-cold.log"
          modules=$(wc -l < formal/modules.txt)
          grep -E "^PASS $modules cold project modules, $modules independent kernel replays, 212 source axiom reports and 8 targeted reports$" "$receipts/lean-cold.log"
          {
            printf 'module\tsource_sha256\tobject_sha256\n'
            sed -nE 's/^kernel_replay_exit=0 ([^ ]+) source_sha256=([0-9a-f]+) object_sha256=([0-9a-f]+)$/\1\t\2\t\3/p' "$receipts/lean-cold.log"
          } > "$receipts/module-receipts.tsv"
          test "$(wc -l < "$receipts/module-receipts.tsv")" -eq "$((modules + 1))"
          if [[ -f verification/module-receipts.tsv ]]; then
            cmp verification/module-receipts.tsv "$receipts/module-receipts.tsv"
          fi

      - name: Save verification receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bounded-window-verification
          path: ${{ runner.temp }}/bounded-window-receipts/
          if-no-files-found: warn
          retention-days: 14
